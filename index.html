    <script>
      (function () {
        var fullFontsUrl =
          'https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Monoton&family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@400;600;700&family=Outfit:wght@400;600;700;800&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Poppins:wght@400;600;700;800&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:wght@400;500;700;900&family=Unica+One&display=swap';
        function loadStudioFonts() {
          if (window.location.pathname.startsWith('/studio')) {
            var fontLink = document.getElementById('google-fonts');
            if (fontLink) {
              fontLink.crossOrigin = 'anonymous';
              if (fontLink.href !== fullFontsUrl) {
                fontLink.href = fullFontsUrl;
              }
            }
          }
        }
        loadStudioFonts();
        window.addEventListener('popstate', loadStudioFonts);
        var origPushState = history.pushState;
        if (origPushState) {
          history.pushState = function () {
            var ret = origPushState.apply(this, arguments);
            loadStudioFonts();
            return ret;
          };
        }
        var origReplaceState = history.replaceState;
        if (origReplaceState) {
          history.replaceState = function () {
            var ret = origReplaceState.apply(this, arguments);
            loadStudioFonts();
            return ret;
          };
        }
      })();
    </script>
